# Fly.io: `fly deploy` from imaging/. Private only (no [http_service]); the backend calls
# http://latestay-imaging.flycast:8081 with IMAGING_TOKEN. See docs/DEPLOY.md.
app = "latestay-imaging"
primary_region = "sin"

[build]

[env]
  PORT = "8081"

[[services]]
  internal_port = 8081
  protocol = "tcp"
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 8081
    handlers = ["http"]

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    path = "/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
