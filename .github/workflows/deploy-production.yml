name: Deploy production

# Only from a version tag (git tag v1.2.0 && git push origin v1.2.0). CI runs on the tagged commit first, then the
# "production" environment waits for a required reviewer to approve before anything is deployed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to production
    needs: ci
    runs-on: ubuntu-24.04
    # Settings > Environments > production: "Required reviewers" makes this the manual approval step.
    environment:
      name: production
      url: https://latestay.in
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Backend (latestay-api)
        working-directory: backend
        run: flyctl deploy --config fly.toml --remote-only --image-label "${GITHUB_REF_NAME}"
      - name: Imaging (latestay-imaging)
        working-directory: imaging
        run: flyctl deploy --config fly.toml --remote-only --image-label "${GITHUB_REF_NAME}"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Web (Vercel project latestay)
        working-directory: web
        run: |
          npx --yes vercel@64.0.2 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@64.0.2 build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@64.0.2 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
      - name: Health check
        run: curl --fail --retry 10 --retry-delay 6 --retry-all-errors -s https://api.latestay.in/api/health
