[project]
name = "latestay-sim"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ashmithelps", email = "thakurashmit20@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "pydantic>=2.14.1",
]

[project.scripts]
latestay-sim = "latestay_sim:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
