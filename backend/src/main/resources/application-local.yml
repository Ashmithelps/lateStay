spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/latestay}
    username: ${DB_USER:latestay}
    password: ${DB_PASSWORD:latestay}
  jpa:
    show-sql: false

# Without Razorpay test keys, payments go through FakeRazorpayGateway and /api/dev/payments.
latestay:
  razorpay:
    allow-fake: true

logging:
  level:
    com.latestay: DEBUG
    org.hibernate.SQL: DEBUG
