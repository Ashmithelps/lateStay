spring:
  application:
    name: latestay-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

# Public API contract for the web app (types are generated from it). Admin and dev endpoints are left out.
springdoc:
  api-docs:
    version: openapi_3_0
  paths-to-match: /api/**
  paths-to-exclude: /api/admin/**, /api/dev/**

management:
  endpoints:
    web:
      exposure:
        include: health

latestay:
  web-origin: ${WEB_ORIGIN:http://localhost:3000}
  admin:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
  booking:
    deposit-cap: ${BOOKING_DEPOSIT_CAP:200}
    commission: ${BOOKING_COMMISSION:100}
    payment-window: 10m
    confirm-window: 5m
    arrival-grace: 60m
    no-show-after: 60m
  jobs:
    enabled: ${JOBS_ENABLED:true}
    interval: 15s
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    allow-fake: false
  whatsapp:
    phone-number-id: ${WA_PHONE_NUMBER_ID:}
    access-token: ${WA_ACCESS_TOKEN:}
    verify-token: ${WA_VERIFY_TOKEN:}
    app-secret: ${WA_APP_SECRET:}
    graph-version: ${WA_GRAPH_VERSION:v23.0}
    language: en
    send-interval: 5s
    ping-cron: "0 0 21 * * *"
  llm:
    provider: ${LLM_PROVIDER:none}
    model: ${LLM_MODEL:}
    api-key: ${LLM_API_KEY:}
    base-url: ${LLM_BASE_URL:}
    timeout: 8s
