# Tests call BookingJobs directly with a fixed clock.
latestay.jobs.enabled=false
latestay.razorpay.allow-fake=true
latestay.razorpay.webhook-secret=test_webhook_secret
latestay.whatsapp.app-secret=test_wa_app_secret
latestay.whatsapp.verify-token=test_wa_verify_token
latestay.rate-limit.enabled=false
latestay.whatsapp.admin-number=+91 90000 11111
latestay.public-web-url=https://latestay.test
latestay.whatsapp.support-number=+91 90000 22222
# Existing integration tests assert the engine's rules before occupancy pricing; PricingInputsIT and
# GroupBookingIT run with version 2.
latestay.pricing.version=1
# Small pools: every cached test context keeps its own, all on one shared container.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
